version: 2

models:
  - name: int_trip_metrics
    description: >
      Modele d'enrichissement business. Il calcule les metriques de trajet,
      les categories de distance et les periodes temporelles attendues dans la partie avancee.
    columns:
      - name: trip_id
        description: Cle technique stable calculee pour materialiser les faits.
        tests:
          - not_null
      - name: trip_duration_minutes
        description: Duree du trajet en minutes.
        tests:
          - not_null
      - name: distance_category
        description: Categorie metier basee sur la distance du trajet.
        tests:
          - accepted_values:
              arguments:
                values: ['court_trajet', 'trajet_moyen', 'long_trajet', 'tres_long_trajet']
      - name: time_period
        description: Periode temporelle de la prise en charge.
        tests:
          - accepted_values:
              arguments:
                values: ['rush_matinal', 'journee', 'rush_soir', 'soiree', 'nuit']
      - name: day_type
        description: Regroupement semaine ou weekend.
        tests:
          - accepted_values:
              arguments:
                values: ['jour_semaine', 'weekend']
